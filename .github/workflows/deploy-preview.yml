name: Deploy Preview

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "game-mvp/**"
      - ".github/workflows/**"

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Write Vercel project mapping
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy preview
        id: deploy
        run: |
          DEPLOY_OUTPUT="$(vercel deploy --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")"
          echo "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL="$(printf "%s\n" "$DEPLOY_OUTPUT" | awk 'match($0,/https:\/\/[A-Za-z0-9.-]+\.vercel\.app/){url=substr($0,RSTART,RLENGTH)} END{print url}')"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to detect preview URL from Vercel output"
            exit 1
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview-link -->';
            const body = `${marker}
            ✅ Preview 部署完成：${process.env.PREVIEW_URL}

            - Commit: \`${context.sha.substring(0, 7)}\`
            - Workflow: \`${context.workflow}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Notify Feishu (preview success)
        if: success() && secrets.FEISHU_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          SHA_VALUE: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD="$(python3 - <<'PY'
          import json
          import os

          text = (
              "部署通知 ✅ Preview 部署成功\n"
              f"仓库: {os.environ['REPO']}\n"
              f"PR: #{os.environ['PR_NUMBER']}\n"
              f"分支: {os.environ['BRANCH_NAME']}\n"
              f"Commit: {os.environ['SHA_VALUE'][:7]}\n"
              f"预览链接: {os.environ['DEPLOY_URL']}\n"
              f"触发人: {os.environ['ACTOR']}\n"
              f"日志: {os.environ['RUN_URL']}"
          )
          print(json.dumps({"msg_type": "text", "content": {"text": text}}, ensure_ascii=False))
          PY
          )"
          curl -sS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Feishu (preview failure)
        if: failure() && secrets.FEISHU_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          SHA_VALUE: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD="$(python3 - <<'PY'
          import json
          import os

          text = (
              "部署通知 ❌ Preview 部署失败\n"
              f"仓库: {os.environ['REPO']}\n"
              f"PR: #{os.environ['PR_NUMBER']}\n"
              f"分支: {os.environ['BRANCH_NAME']}\n"
              f"Commit: {os.environ['SHA_VALUE'][:7]}\n"
              f"触发人: {os.environ['ACTOR']}\n"
              f"日志: {os.environ['RUN_URL']}"
          )
          print(json.dumps({"msg_type": "text", "content": {"text": text}}, ensure_ascii=False))
          PY
          )"
          curl -sS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
