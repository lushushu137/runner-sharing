name: CI

on:
  pull_request:
    paths:
      - 'game-mvp/**'
      - '.github/workflows/**'
  push:
    branches:
      - dev
    paths:
      - 'game-mvp/**'
      - '.github/workflows/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
